# MVP 2: agriculture, storage, technology, innovation, diffusion, trade, aggregation.
# Two forager bands with no cultivation knowledge colonize a 400 x 400 km world.
# Nothing here says where or whether farming or sedentism appear.
name: mvp2_neolithic
description: Forager colonization with endogenous knowledge, cultivation, storage, and exchange.

simulation:
  start_year: 0
  n_years: 1000
  seed: 0

world:
  topology:
    seed: 7
    width: 40
    height: 40
    cell_size_km: 10.0
    sea_fraction: 0.25

knowledge_system: ../technologies/neolithic.yaml

species:
  - id: human
    profile: ../species/human.yaml

initial_populations:
  - species: human
    cell: [10, 16]
    population: 30
  - species: human
    cell: [22, 12]
    population: 30

resolution:
  max_units_per_cell: 3
  max_knowledge_distance: 1.0

# Reference calibration mode: no computational aggregation. Coarsening to 3 units per cell
# measurably changes outcomes (population -11%, migration -7%, inventions +24% over 600
# years; see objective/status.md), so calibration and baselines run without it. Setting
# `aggregation: true` with `max_units_per_cell: 8` matches this reference within noise.
mechanisms:
  aggregation: false

output:
  spatial_snapshot_interval_years: 25
  log_migrations: false
