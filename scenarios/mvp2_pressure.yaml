# MVP 2 intensification-pressure scenario (P5 agriculture validation).
# A small bounded, fully terrestrial 80 x 80 km world already occupied by 16 forager bands
# (30 people each, one per 2 x 2 block of cells) with no cultivation knowledge. There is no
# open frontier: foragers alone level off at ~1,100-1,300 people from years 150-200, with
# food ratios near or below 1 and rising mortality (seed 0, cultivation off). The design
# criterion was only this early forager saturation; nothing here says whether cultivation
# appears or pays. Everything else is the canonical MVP 2 setup. (Two bands on 16 x 16
# cells were rejected: colonization reached only 61 of 256 cells by year 400.)
name: mvp2_pressure
description: Foragers in a small bounded world that saturates early (intensification pressure).

simulation:
  start_year: 0
  n_years: 400
  seed: 0

world:
  topology:
    seed: 3
    width: 8
    height: 8
    cell_size_km: 10.0
    sea_fraction: 0.0

knowledge_system: ../technologies/neolithic.yaml

species:
  - id: human
    profile: ../species/human.yaml

initial_populations:
  - {species: human, cell: [1, 1], population: 30}
  - {species: human, cell: [1, 3], population: 30}
  - {species: human, cell: [1, 5], population: 30}
  - {species: human, cell: [1, 7], population: 30}
  - {species: human, cell: [3, 1], population: 30}
  - {species: human, cell: [3, 3], population: 30}
  - {species: human, cell: [3, 5], population: 30}
  - {species: human, cell: [3, 7], population: 30}
  - {species: human, cell: [5, 1], population: 30}
  - {species: human, cell: [5, 3], population: 30}
  - {species: human, cell: [5, 5], population: 30}
  - {species: human, cell: [5, 7], population: 30}
  - {species: human, cell: [7, 1], population: 30}
  - {species: human, cell: [7, 3], population: 30}
  - {species: human, cell: [7, 5], population: 30}
  - {species: human, cell: [7, 7], population: 30}

resolution:
  max_units_per_cell: 3
  max_knowledge_distance: 1.0

# Reference calibration mode, as in mvp2_neolithic: no computational aggregation.
mechanisms:
  aggregation: false

output:
  spatial_snapshot_interval_years: 25
  log_migrations: false
