[project]
name = "madexplorer"
version = "0.1.0"
description = "madexplorer"
readme = "README.md"
authors = [
    { name = "ashwin2rai", email = "54918223+ashwin2rai@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
madexplorer = "madexplorer:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["objective"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
